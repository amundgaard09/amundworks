
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "durapy"
version = "0.0.1.7"
description = "DuraPy - Multi-disciplinary engineering software for STEMP workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["engineering", "math", "physics", "science", "python", "cli", "stemp"]
authors = [{name = "Simon Stordal Amundgård"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "prompt_toolkit",
    "numpy",
    "sympy",
]

[project.urls]
Homepage = "https://github.com/amundgaard09/durendal"
Repository = "https://github.com/amundgaard09/durendal"

[tool.setuptools.packages.find]
where = ["."]
include = ["durapy*"]